version: '3.8'

services:
  nebula-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nebula-api
    ports:
      - "8000:8000"
    volumes:
      - ./nebula:/app/nebula
      - ./nebula/data:/app/nebula/data
      - ./nebula/exports:/app/nebula/exports
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - nebula-net
    restart: unless-stopped

networks:
  nebula-net:
    driver: bridge
