[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nebula-engine"
version = "0.3.0"
description = "AI-Powered Kitchen Operating System for CulinArt/Compass Group"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "pytest-cov>=4.0.0", "ruff>=0.1.0"]

[project.scripts]
nebula = "nebula.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["nebula"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --tb=short"
